[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-cli"
version = "0.1.0"
description = "Agent-native local literature management CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "yuxiangzhang", email = "lin.qian2023@gmail.com" },
]
keywords = [
  "papers",
  "literature-management",
  "cli",
  "mineru",
  "ai-agents",
  "research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "PyYAML>=6.0.1",
  "pypdf>=4.0.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/lin-qian123/paper-cli"
Repository = "https://github.com/lin-qian123/paper-cli"
Issues = "https://github.com/lin-qian123/paper-cli/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
paper = "paper_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
